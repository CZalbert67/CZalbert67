<svg xmlns="http://www.w3.org/2000/svg" width="600" height="60">
  <defs>
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur">
        <animate attributeName="stdDeviation" values="2;3.5;2" dur="3s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="2" />
      </feComponentTransfer>
      <feFlood flood-color="#DC143C" result="color" />
      <feComposite in="color" in2="boost" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .poem-text {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 15px;
        font-weight: bold;
        fill: #FFFFFF;
        text-anchor: middle;
        filter: url(#crimson-glow);
        opacity: 0;
      }
      .line1 { animation: fade1 24s infinite linear; }
      .line2 { animation: fade2 24s infinite linear; }
      .line3 { animation: fade3 24s infinite linear; }
      .line4 { animation: fade4 24s infinite linear; }

      @keyframes fade1 {
        0%, 25%, 100% { opacity: 0; }
        4%, 21% { opacity: 1; }
      }
      @keyframes fade2 {
        0%, 25%, 100% { opacity: 0; }
        29%, 46% { opacity: 1; }
      }
      @keyframes fade3 {
        0%, 50%, 100% { opacity: 0; }
        54%, 71% { opacity: 1; }
      }
      @keyframes fade4 {
        0%, 75%, 100% { opacity: 0; }
        79%, 96% { opacity: 1; }
      }
    </style>
  </defs>
  <text x="300" y="35" class="poem-text line1">Somos instantes en busca de una eternidad...</text>
  <text x="300" y="35" class="poem-text line2">...mientras el silencio susurra lo que el tiempo se llevó.</text>
  <text x="300" y="35" class="poem-text line3">La vida es una constante despedida...</text>
  <text x="300" y="35" class="poem-text line4">...de lo que nunca quisimos dejar ir.</text>
</svg>
