<svg xmlns="http://www.w3.org/2000/svg" width="600" height="130">
  <defs>
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur">
        <animate attributeName="stdDeviation" values="1.8;3.2;1.8" dur="3s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="2" />
      </feComponentTransfer>
      <feFlood flood-color="#DC143C" result="color" />
      <feComposite in="color" in2="boost" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .poem-text {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #FFFFFF;
        text-anchor: middle;
        filter: url(#crimson-glow);
      }
    </style>
  </defs>
  <text x="300" y="28" class="poem-text">Somos instantes en busca de una eternidad...</text>
  <text x="300" y="58" class="poem-text">...mientras el silencio susurra lo que el tiempo se llevó.</text>
  <text x="300" y="88" class="poem-text">La vida es una constante despedida...</text>
  <text x="300" y="118" class="poem-text">...de lo que nunca quisimos dejar ir.</text>
</svg>
