<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50">
  <defs>
    <linearGradient id="rgb-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055">
        <animate attributeName="stop-color" values="#ff0055;#00ffcc;#9900ff;#ffcc00;#ff0055" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00aaff">
        <animate attributeName="stop-color" values="#00aaff;#ff00ff;#00ff66;#ff3300;#00aaff" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="rgb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#rgb-glow)">
    <!-- Left Icon -->
    <path d="M15 11V5l-3-3-3 3v2H3v14h18V11h-6zm-8 8H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm6 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm6 12h-2v-2h2v2zm0-4h-2v-2h2v2z" transform="translate(150, 13) scale(1.1)" fill="url(#rgb-grad)" />
    <!-- Text -->
    <text x="300" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="url(#rgb-grad)" text-anchor="middle">Ciudad de Contribuciones</text>
    <!-- Right Icon -->
    <path d="M15 11V5l-3-3-3 3v2H3v14h18V11h-6zm-8 8H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm6 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm6 12h-2v-2h2v2zm0-4h-2v-2h2v2z" transform="translate(425, 13) scale(1.1)" fill="url(#rgb-grad)" />
  </g>
</svg>