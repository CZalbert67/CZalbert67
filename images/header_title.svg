<svg xmlns="http://www.w3.org/2000/svg" width="600" height="70">
  <defs>
    <filter id="pulse-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2.5;4.5;2.5" dur="3s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="2.5" />
      </feComponentTransfer>
      <feFlood flood-color="#DC143C" result="color" />
      <feComposite in="color" in2="boost" operator="in" result="colored-glow" />
      <feMerge>
        <feMergeNode in="colored-glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
