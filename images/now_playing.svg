    <!-- Right Icon -->
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" transform="translate(390, 13) scale(1.1)" fill="url(#rgb-grad)" />
