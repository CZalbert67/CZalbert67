<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50">
  <defs>
    <linearGradient id="rgb-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055">
        <animate attributeName="stop-color" values="#ff0055;#00ffcc;#9900ff;#ffcc00;#ff0055" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00aaff">
        <animate attributeName="stop-color" values="#00aaff;#ff00ff;#00ff66;#ff3300;#00aaff" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="rgb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#rgb-glow)">
    <!-- Left Icon -->
    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z" transform="translate(220, 13) scale(1.1)" fill="url(#rgb-grad)" />
    <!-- Text -->
    <text x="300" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="url(#rgb-grad)" text-anchor="middle">Frontend</text>
    <!-- Right Icon -->
    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z" transform="translate(355, 13) scale(1.1)" fill="url(#rgb-grad)" />
  </g>
